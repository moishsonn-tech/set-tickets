// Stage 10: a checkout now records which policy versions the buyer accepted. The UI sends them itself; direct DB.placeOrder calls in
// this older suite accept the current ones (acceptAll), so these checks keep testing what they were written for. Its many orders from one
// browser stand for many different buyers, so the demo's per-browser checkout rate limit is reset for them.
function acceptAll(w){try{if(w&&w.eval&&w.eval('typeof DB==="object"&&!DB._acc'))w.eval(`(()=>{const po=DB.placeOrder;DB.placeOrder=function(p,t){for(const k in RL)delete RL[k];if(p&&p.accepted===undefined&&!t){const st=Demo.st,ids=[...new Set([...(p.items||[]),...(p.addons||[])].map(i=>i.eventId))],evs=ids.map(id=>st.events.find(e=>e.id===id)).filter(Boolean),bo=st.boxOffices.find(b=>b.id===(evs[0]&&evs[0].box_office_id));p={...p,accepted:policiesFor(bo,evs).map(({kind,eventId,version})=>({kind,eventId,version}))}}return po.call(this,p,t)};DB._acc=1})()`)}catch(e){}return w}

// of the same rules is checked for real on Postgres by tests/db-e2e.sh.

  // guest uses a credit code at checkout (box office wide)
  E(`S.cart={items:[{eventId:'${neon.id}',ticketTypeId:'${neon.ticketTypes[0].id}',qty:1}],addons:[],donation:0,unlock:{}};saveCart()`);
  await E('A.signOut()'); W().location.hash='#/cart'; await until(()=>has('Checkout')); E(`A.openCredit()`); E(`S.co.creditCode='${cr.code}'`); await E('A.applyCredit()'); await sleep(40);
  const cq=E('cartQuote()'); ok(cq.credit>0 && has('Credit applied'),'guest: credit code applied at checkout, shown in the breakdown');
  Object.assign(E('S.co'),{name:'Cara Credit',email:'cara@test.co',terms:true,payment:'offline'}); await E('A.placeOrder()'); await until(()=>/#\/order\//.test(W().location.hash));
  const used=E(`Demo.st.orders.slice(-1)[0]`); ok(used.data.credit.code===cr.code && used.data.credit.amount===cq.credit,'the order records which credit paid how much');
  ok(E(`creditState(Demo.st.credits.find(c=>c.code==='${cr.code}'),Demo.st.orders).remaining`)===cr.amount-cq.credit,'remaining balance goes down');
  // signed-in customer: their credit is offered automatically
  W().location.hash='#/account'; await until(()=>W().document.querySelector('[data-input="authEmail"],[data-bind]'));
  await E(`DB.custSignIn('maya@example.com','tickets123')`); await E('loadCustomer()');
  E(`S.myCredits=null;S._credReq=0;S.cart={items:[{eventId:'${neon.id}',ticketTypeId:'${neon.ticketTypes[0].id}',qty:1}],addons:[],donation:0,unlock:{}};saveCart()`);
  W().location.hash='#/cart'; await until(()=>E('S.myCredits')); await sleep(60); E('render()');
  ok(E('S.co.useAcct')===true && E('cartQuote()').credit===Math.min(E("S.myCredits").filter(c=>c.status==="active").reduce((a,c)=>Math.max(a,c.remaining),0),E('cartQuote()').total+E('cartQuote()').credit) && has('Use my credit'),'signed-in customer: account credit applied automatically');
  W().location.hash='#/account'; E('S.wallet=null'); await until(()=>has('applied automatically'));
  ok(has('$25') && has('applied automatically at checkout'),'customer account shows the credit balance');
  await E('DB.custSignOut()'); E('S.cust=null');
  await as('moishsonn@gmail.com');
  // manual admin application + revocation
  const r10=await buy({items:[{eventId:neon.id,ticketTypeId:neon.ticketTypes[0].id,qty:1}],payMethod:'cash',buyer:{name:'Cara Credit',email:'cara@test.co'}});
  await act(r10.id,'addAddon',{eventId:neon.id,addonId:(neon.addons||[])[0]?.id,qty:1,settle:'due'}).catch(()=>{});
  if (!(order(r10.id).data.due>0)) { E(`Demo.st.orders.find(o=>o.id==='${r10.id}').data.due=1500;Demo.save()`); }
  const bc=E(`Demo.st.credits.find(c=>c.code==='${cr.code}')`); await E(`DB.creditAction('apply',{id:'${bc.id}',order:'${r10.id}'})`);
  ok(order(r10.id).data.charges.some(c=>c.method==='credit') && E(`creditState(Demo.st.credits.find(c=>c.code==='${cr.code}'),Demo.st.orders).uses`).some(u=>u.manual&&u.ref===order(r10.id).ref),'staff apply a credit to a balance due (manual application)');
  await E(`DB.creditAction('revoke',{id:'${bc.id}'})`); const rv=E(`Demo.st.credits.find(c=>c.code==='${cr.code}')`);
  ok(rv.revoked_by==='moishsonn@gmail.com' && E(`creditState(Demo.st.credits.find(c=>c.code==='${cr.code}'),Demo.st.orders).remaining`)===0,'staff revoke a credit (who and when kept)');
  await E('reloadAdmin()'); const cs6=E(`S.adm.credits.find(c=>c.code==='${cr.code}')`);
  ok(cs6.used>0 && cs6.uses.length>=2 && cs6.uses.some(u=>u.events.includes(neon.id)) && cs6.status==='revoked','credit tracking: issued, used, remaining, where used, revoked');

  // ── §7 customer records ──
  await view('#/admin/customers'); ok(has('Customers') && has('Cara Credit'),'customer list');
  await view('#/admin/customers/'+encodeURIComponent('cara@test.co'));
  ok(['Total spent','Upcoming events','Order history','Refunds','Credits','Internal notes','Promo codes used','Products bought','Complimentary tickets','guest'].every(has),'customer profile: tickets, events, orders, spent, refunds, credits, comps, codes, products, notes, account status');
  E(`S.ui.cnote='Calls ahead before shows'`); await E(`A.custNote({dataset:{v:'cara@test.co'}})`); await sleep(40); ok(has('Calls ahead before shows'),'internal note on a customer');
  await view('#/admin/customers/'+encodeURIComponent('maya@example.com')); ok(has('customer account'),'shows when a customer has an account');

  // ── §8 complete change history ──
  const hist=E(`Demo.st.orderLog.filter(x=>x.order_id==='${r1.id}')`), upRow=hist.find(x=>x.kind==='change'&&x.data.net===3500);
  ok(upRow && upRow.data.tickets[0].from.paid===6500 && upRow.data.tickets[0].to.paid===10000 && upRow.data.tickets[0].from.seat && upRow.data.tickets[0].to.seat && upRow.data.charge.amount===3500 && upRow.by==='moishsonn@gmail.com' && upRow.at,'history: original + new ticket, seat, price, difference, payment collected, who, when');
  ok(hist.some(x=>x.kind==='change'&&x.data.refund&&x.data.refund.amount===3500) && hist.some(x=>x.note==='aisle please'),'history: refunds issued and reasons are kept');
  ok(E(`Demo.st.tickets.filter(t=>t.order_id==='${r1.id}'&&t.status==='replaced').length`)>=3,'never overwritten: every replaced ticket is still on file');
  await view('#/admin/orders/'+r1.id); ok(has('Upgrade $35.00') || has('upgrade $35.00'),'order page timeline shows the upgrade');

  // ── §10 communication ──
  await E(`DB.orderAction('${r1.id}','resend',{kind:'tickets'})`); await E(`DB.orderAction('${r1.id}','resend',{kind:'confirmation'})`);
  await E(`DB.orderAction('${r1.id}','message',{subject:'Parking update',body:'Use the north entrance.'})`); await E(`DB.orderAction('${r1.id}','note',{body:'VIP — artist friend'})`);
  const mails=E(`Demo.st.outbox.filter(m=>m.order_id==='${r1.id}').map(m=>m.kind)`);
  ok(['tickets','confirmation_copy','message','updated'].every(k=>mails.includes(k)),'resend tickets, resend confirmation, custom message, updated tickets after changes — all on record');
  await E('reloadAdmin()'); await view('#/admin/orders/'+r1.id);
  ok(has('Parking update') && has('Updated tickets') && has('VIP — artist friend'),'order page lists previous communications and internal notes');
  // customer + holder edits keep the before / after
  await act(r1.id,'customer',{phone:'(212) 555-0199'}); ok(lastLog(r1.id).before.phone==='(212) 555-0142' && order(r1.id).data.buyer.phone==='(212) 555-0199','customer details change keeps the old details');
  await act(r1.id,'holder',{ticket:live(r1.id)[0].id,name:'Guest Two'}); ok(live(r1.id)[0].holder==='Guest Two','put a ticket in someone else’s name');
  // products on an existing order
  const before=E(`availabilityFrom(Demo.st.tickets,'${g.id}',[],'',Demo.st.orders).ad['${park.id}']||0`);
  await act(r1.id,'addAddon',{eventId:g.id,addonId:park.id,qty:2,settle:'collect',method:'cash'});
  ok(E(`availabilityFrom(Demo.st.tickets,'${g.id}',[],'',Demo.st.orders).ad['${park.id}']`)===before+2 && live(r1.id).every(t=>t.extras.some(x=>x.includes(park.name+' × 2'))),'add a product to an order (stock + tickets updated)');
  const li=order(r1.id).data.lines.findIndex(l=>l.kind==='addon'&&l.added); await act(r1.id,'removeAddon',{line:li,qty:2,refund:true,to:'cash'});
  ok(E(`availabilityFrom(Demo.st.tickets,'${g.id}',[],'',Demo.st.orders).ad['${park.id}']`)===before,'remove a product with a refund (stock back)');

  // ── §9 live activity ──
  E(`DB.ping('${g.id}',4)`); E(`DB.ping('${g.id}',0,true)`);
  E(`(()=>{const e=Demo.st.events.find(x=>x.slug==='winter-orchestra-gala');Demo.st.seatStatus.push({id:'h1',box_office_id:e.box_office_id,event_id:e.id,slot_id:'',seat:'${free('winter-orchestra-gala','Circle',1)[0]}',status:'checkout',token:'tk',expires_at:new Date(Date.now()+5e5).toISOString(),at:new Date().toISOString()});Demo.save()})()`);
  await E('reloadAdmin()'); const lv=E(`S.adm.live['${g.id}']`);
  ok(lv.now>=1 && lv.converted>=1 && 'abandoned' in lv && 'cartTickets' in lv,'live presence: viewing now, carts, converted, abandoned');
  await view(`#/admin/event/${g.id}/live`);
  ok(['Viewing now','Active carts','Seats held in checkout','Orders · last 10 min','Views today','Cart abandonment','Checkout conversion','Live sales','Traffic sources','Sales by source','tied up in checkout vs sold'].every(has),'Live activity tab: views, viewers, carts, held seats, checkouts, abandonment, conversion, live sales, sources');
  ok(E(`liveData(S.adm.events.find(e=>e.id==='${g.id}')).holds`)>=1,'seats temporarily held during checkout counted separately from sold');

  // ── security: permissions on every order change ──
  await as('manager@skyline.example');
  ok(/permission/.test(String(await throwsP(`DB.orderAction('${r2.id}','change',{changes:[{ticket:'${live(r2.id)[0].id}',seat:'${free('winter-orchestra-gala','Stalls',1)[0]}'}],settle:'waive',downgrade:'none'})`))),'event manager without “Change seats” cannot change tickets');
  ok(/permission/.test(String(await throwsP(`DB.orderAction('${r2.id}','refund',{mode:'full'})`))),'… nor refund');
  ok(/permission/.test(String(await throwsP(`DB.creditAction('issue',{email:'x@test.co',amount:100})`))),'… nor issue credit');
  await as('support@skyline.example');
  const rs1=await act(r2.id,'refund',{mode:'amount',amount:100,to:'cash'}); ok(rs1.refund.amount===100,'customer service (has “Issue refunds”) can refund');
  ok(/permission/.test(String(await throwsP(`DB.orderAction('${r2.id}','change',{changes:[{ticket:'${live(r2.id)[0].id}',price:1}],settle:'waive',downgrade:'none'})`))),'price overrides on a change need “Change pricing”');
  await E('A.signOut()'); E(`DB._actor=null`);
  ok(!!(await throwsP(`DB.orderAction('${r2.id}','note',{body:'x'})`)),'signed out: no order changes at all');
  ok(E(`Demo.st.orders.filter(o=>o.status==='paid').every(o=>Demo.st.outbox.filter(m=>m.order_id===o.id&&m.kind==='confirmation').length<=1)`),'still exactly one order confirmation per order');
  log('DONE');
}catch(e){log('ERROR '+e.message+'\n'+e.stack)}})();
</script></body></html>
