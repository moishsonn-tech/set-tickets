  // ── §9 accounting ──
  const j=E(`journal(finReport(${X()}))`), days=[...new Set(j.map(x=>x.date))];
  ok(j.length>20 && days.every(d=>{const r=j.filter(x=>x.date===d);return r.reduce((a,x)=>a+x.debit,0)===r.reduce((a,x)=>a+x.credit,0)}),'§9 a balanced journal for every day (debits = credits)');
  await view('#/admin/reports/accounting'); ok(has('QuickBooks Online') && has('Xero') && has('✓'),'§9 accounting page: QuickBooks / Xero / API');
  E(`S.ui.acct={tickets:'4100 Box office sales',tickets_code:'4100'}`); await E('A.acctSave()');
  E(`A.xpJournal({dataset:{v:'xero'}})`); ok(dl[1].startsWith('*Narration') && dl[1].includes(',4100,'),'§9 Xero journal uses your account codes');
  E(`A.xpJournal({dataset:{v:'quickbooks'}})`); ok(dl[1].startsWith('Journal No') && dl[1].includes('4100 Box office sales'),'§9 QuickBooks journal uses your account names');

  // ── §10 data ownership ──
  const all=await E(`DB.exportAll(DB._bo)`);
  ok(all.orders.length===E(`Demo.st.orders.filter(o=>o.box_office_id===DB._bo).length`) && !JSON.stringify(all).includes('access_key') && all.tickets.length && all.expenses.length && all.payouts.length,'§10 the box office downloads all of its data (no private keys)');
  E(`A.xpOwn({dataset:{fmt:'xlsx'}})`); await sleep(50); ok(/all-data.*\.xlsx$/.test(dl[0]),'§10 … as an Excel workbook');
  await as('finance@skyline.example'); ok(/owner/.test(String(await throwsP(`DB.exportAll(DB._bo)`))),'§10 staff without both export permissions can\'t download everything');
  await as('director@harborarts.example'); ok(/super admin/i.test(String(await throwsP(`DB.platformExport()`))),'§10 only platform super admins export platform-wide data');
  ok(String(await throwsP(`DB.exportAll(Demo.st.boxOffices[0].id)`)).length>0,'§10 one box office can\'t download another\'s data');
  await as('moishsonn@gmail.com'); const pe=await E('DB.platformExport()');
  ok(pe.box_offices.length===3 && pe.orders.length===E('Demo.st.orders.length') && !JSON.stringify(pe).includes('buyer_email'),'§10 platform owner: platform-wide export without customer contact data');
  E(`(()=>{const b=Demo.st.boxOffices.find(b=>b.id===DB._bo);b.status='suspended';Demo.save()})()`); await E('reloadAdmin()'); await view('#/admin');
  ok(has('download all of your data'),'§10 a suspended box office\'s owner still sees "download all of your data"');
  W().document.querySelector('[data-action="gateXp"]').click(); await sleep(150); ok(/all-data.*\.xlsx$/.test(dl[0]),'§10 … and gets it');
  E(`(()=>{const b=Demo.st.boxOffices.find(b=>b.id===DB._bo);b.status='active';b.settings.taxPct=0;Demo.save()})()`); await E('reloadAdmin()');

  // ── permissions & pages ──
  await as('door@example.com'); ok(!E(`navOk(NAV.find(n=>n[0]==='reports'))`) && E('S.adm.payouts.length')===0 && E('S.adm.procTx.length')===0,'door staff: no reports, payouts or processor data');
  await as('support@skyline.example'); ok(E('S.adm.tickets.every(t=>t.proc===null)'),'processing fees per ticket are hidden without "View payment processing information"');
  await as('moishsonn@gmail.com'); E('S.ui.rep=emptyFin()');
  for (const [h,t] of [['#/admin/reports','Financial summary'],['#/admin/reports/events','Gross sold'],['#/admin/reports/payouts','Total processed'],['#/admin/reports/profit','Expenses'],['#/admin/reports/exports','Export'],['#/admin/reports/accounting','Journal preview'],['#/admin/orders/'+r1.id,'Chargebacks'],['#/platform','Export platform data']]) { await view(h); ok(has(t),'page renders: '+h); }
  log('DONE');
}catch(e){log('ERROR '+e.message+'\n'+e.stack)}})();
</script></body></html>
