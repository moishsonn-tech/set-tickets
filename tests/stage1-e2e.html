<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="out">running</pre><iframe id="f" style="width:1300px;height:900px"></iframe><script>
// Stage 10: a checkout now records which policy versions the buyer accepted. The UI sends them itself; direct DB.placeOrder calls in
// this older suite accept the current ones (acceptAll), so these checks keep testing what they were written for. Its many orders from one
// browser stand for many different buyers, so the demo's per-browser checkout rate limit is reset for them.
function acceptAll(w){try{if(w&&w.eval&&w.eval('typeof DB==="object"&&!DB._acc'))w.eval(`(()=>{const po=DB.placeOrder;DB.placeOrder=function(p,t){for(const k in RL)delete RL[k];if(p&&p.accepted===undefined&&!t){const st=Demo.st,ids=[...new Set([...(p.items||[]),...(p.addons||[])].map(i=>i.eventId))],evs=ids.map(id=>st.events.find(e=>e.id===id)).filter(Boolean),bo=st.boxOffices.find(b=>b.id===(evs[0]&&evs[0].box_office_id));p={...p,accepted:policiesFor(bo,evs).map(({kind,eventId,version})=>({kind,eventId,version}))}}return po.call(this,p,t)};DB._acc=1})()`)}catch(e){}return w}
const out=[], log=m=>{out.push(m);document.getElementById('out').textContent=out.join('\n')};
const f=document.getElementById('f'); const W=()=>acceptAll(f.contentWindow); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const E=x=>W().eval(x);
const until=async(fn,ms=6000)=>{const t=Date.now();while(Date.now()-t<ms){try{const v=fn();if(v)return v}catch(e){}await sleep(40)}throw new Error('timeout '+fn)};
const click=sel=>{const el=W().document.querySelector(sel); if(!el) throw new Error('no '+sel); el.click()};
const has=t=>W().document.body.textContent.includes(t);
const ok=(c,m)=>log((c?"PASS ":"FAIL ")+m+(c?"":"  [hash "+W().location.hash+"] "+W().document.body.innerText.slice(0,160).replace(/\s+/g," ")));
async function as(email){ await E('A.signOut()'); await sleep(80); W().location.hash='#/admin'; await until(()=>W().document.querySelector('[data-action="demoAs"]'));
  E(`S.ui.login.email=${JSON.stringify(email)}`); await E('A.login()'); await until(()=>E('S.adm')||E('S.ui.login.mfa')); await sleep(60); }
async function throwsP(code){ try{ await E(code); return false }catch(e){ return e.message||true } }
(async()=>{try{
  f.src='/index.html#/'; await until(()=>E("!S.loading")); W().localStorage.clear(); W().sessionStorage.clear(); W().location.reload(); await sleep(300);
  await until(()=>E("!S.loading") && W().document.querySelector('.ev-card'));
  W().onerror=(e)=>log("PAGE ERROR "+e); W().onunhandledrejection=(e)=>log("PAGE REJECTION "+(e.reason&&e.reason.stack||e.reason)); W().confirm=()=>true;
  ok(await E(`totp(b32enc(new TextEncoder().encode('12345678901234567890')),1)`)==='287082','TOTP matches RFC 6238 test vector');
  ok(E('S.events.length')===5,'platform home lists 5 events from 2 active box offices: '+E('S.events.length'));
  W().location.hash='#/b/harbor-arts'; await until(()=>has('Harbor Arts Center'));
  ok(W().document.querySelectorAll('.ev-card').length===3,'Harbor Arts page shows only its 3 events');
  ok(W().document.documentElement.style.getPropertyValue('--accent')==='#7fd3b4','Harbor branding colour applied');
  W().location.hash='#/b/northside-comedy'; await sleep(100); ok(has('Page not found')||has('not found'),'pending box office has no public page');
  W().location.hash='#/register'; await sleep(80); ok(has('Invitation only'),'public registration is off by default');

  await as('manager@skyline.example');
  ok(E('S.adm.events.length')===1 && E('S.adm.events[0].slug')==='winter-orchestra-gala','event manager sees only the 1 event they are assigned');
  ok(E("can('events.edit')") && !E("can('finance.reports')") && !E("can('admin.invite')"),'event manager perms: edit yes, reports/team no');
  ok(E("S.adm.orders.every(o=>o.buyer_email.includes('•••'))"),'customer emails masked without “View email addresses”');
  W().location.hash='#/admin/reports'; await sleep(80); ok(has('No access'),'Reports page blocked for event manager');
  ok(!W().document.querySelector('.side a[href="#/admin/team"]'),'Team hidden from nav');
  ok(String(await throwsP(`DB.saveMember({email:'x@y.com',perms:['events.view'],events:'all'})`)).includes('permission'),'server-side gate refuses invite by event manager');
  const other=E("Demo.st.events.find(e=>e.slug==='neon-nights-live')");
  ok(String(await throwsP(`DB.saveEvent(${JSON.stringify(other)})`)).includes('permission'),'cannot edit an event outside assigned events');

  await as('door@example.com');
  ok(E('S.adm.events.length')===1 && E('S.adm.orders.length')===0,'door staff: 1 event, no order/financial data');
  ok(E("can('door.scan')") && !E("can('orders.view')"),'door staff can scan, cannot view orders');
  W().location.hash='#/scan'; await sleep(100); ok(!has('No scanner access'),'scanner opens for door staff');

  await as('director@harborarts.example');
  ok(E('S.adm.events.length')===3 && E("S.adm.events.every(e=>e.box_office_id===S.adm.bo.id)"),'Harbor director sees only Harbor events');
  const skyCode=E("Demo.st.tickets.find(t=>t.box_office_id!==S.adm.bo.id&&t.status==='valid').code");
  ok((await E(`DB.checkin('${skyCode}',false)`)).result==='unknown','another box office ticket scans as unknown (no data leak)');
  ok(E("S.adm.orders.every(o=>o.box_office_id===S.adm.bo.id)"),'Harbor sees no Skyline orders');

  await as('moishsonn@gmail.com');
  ok(E('S.adm.super')&&E('S.adm.bos.length')===2,'owner is super admin and member of 2 box offices');
  W().location.hash='#/admin/team/members'; await until(()=>has('Invite a team member'));
  E(`Object.assign(S.ui.inv,{email:'temp@example.com',name:'Temp',template:'scanner',events:'all'})`); await E('A.addMember()');
  ok(E("S.adm.team.some(m=>m.email==='temp@example.com')"),'invited a member with Scanner template');
  W().location.hash='#/admin/team/member/temp%40example.com'; await until(()=>W().document.querySelector('[data-action="permLvl"]'));
  click('[data-action="permLvl"][data-g="finance"][data-v="view"]'); await sleep(30);
  ok(E("S.ui.pe.obj.perms.includes('finance.reports')&&!S.ui.pe.obj.perms.includes('finance.export')"),'View only grants view keys, not export');
  click('[data-action="permKey"][data-v="door.undo"]'); await sleep(30);
  await E('A.savePerms()'); await sleep(80);
  ok(E("S.adm.team.find(m=>m.email==='temp@example.com').perms.includes('door.undo')"),'individual permission saved');
  ok(E("S.adm.audit.some(a=>a.kind==='team.permissions'&&a.summary.includes('temp@example.com'))"),'permission change written to activity log with before/after');
  await E(`A.rmMember({dataset:{v:'manager@skyline.example'}})`); await sleep(50);
  const was=E('DB._actor'); E("DB._actor='manager@skyline.example'"); ok(!(await E('DB.stillAllowed()')),'removed member loses access immediately'); E(`DB._actor=${JSON.stringify(was)}`);
  ok(E("Demo.st.members.some(m=>m.email==='manager@skyline.example'&&m.status==='removed')"),'removed member record kept for history');

  W().location.hash='#/platform'; await until(()=>has('Platform overview'));
  ok(has('waiting for approval'),'platform overview flags pending registration');
  const north=E("S.plat.bos.find(b=>b.slug==='northside-comedy').id"), harbor=E("S.plat.bos.find(b=>b.slug==='harbor-arts').id");
  await E(`DB.setBoxOfficeStatus('${north}','active')`); await E('refreshPublic()');
  ok(E("S.bos.some(b=>b.slug==='northside-comedy')"),'approving makes the box office public');
  await E(`DB.setBoxOfficeStatus('${harbor}','suspended')`); await E('refreshPublic()');
  ok(E('S.events.length')===2,'suspending Harbor takes its events offline: '+E('S.events.length'));
  const harborEv=E("Demo.st.events.find(e=>e.slug==='founders-summit')");
  ok(String(await throwsP(`DB.placeOrder({buyer:{name:'A',email:'a@b.co'},items:[{eventId:'${harborEv.id}',ticketTypeId:'${harborEv.ticketTypes[0].id}',qty:1}],payment:'card',card:{number:'4242424242424242',exp:'12/34',cvc:'123'}})`)).includes('not selling'),'suspended box office checkout refused');
  ok(String(await throwsP(`DB.deleteBoxOffice('${harbor}')`)).includes('Deactivate'),'delete requires deactivation first');
  await E(`DB.setBoxOfficeStatus('${harbor}','deactivated')`);
  ok(String(await throwsP(`DB.deleteBoxOffice('${harbor}')`)).includes('history'),'box office with orders can never be deleted');
  await E(`DB.setBoxOfficeStatus('${harbor}','active')`); await E('refreshPublic()');
  await E(`DB.setBoxOfficeStatus('${north}','deactivated')`); await E(`DB.deleteBoxOffice('${north}')`);
  ok(!E("Demo.st.boxOffices.some(b=>b.slug==='northside-comedy')"),'deactivated box office with no sales can be deleted');
  const nb=await E(`DB.createBoxOffice({name:'Test Hall',ownerEmail:'owner@testhall.example'})`);
  ok(nb.status==='active'&&E("Demo.st.members.some(m=>m.email==='owner@testhall.example'&&m.box_office_id==='"+nb.id+"')"),'super admin creates an active box office with owner');
  await E(`A.support({dataset:{id:'${harbor}'}})`); await sleep(100);
  ok(E('S.adm.me.support')&&E('S.adm.bo.id')===harbor&&has('Support access'),'support access opens Harbor with banner');
  ok(E(`Demo.st.audit.some(a=>a.kind==='support.access'&&a.box_office_id==='${harbor}')`),'support visit logged in Harbor activity');
  await E('A.exitSupport()'); await sleep(80);

  // cart = one organizer
  await E(`(()=>{S.cart={items:[{eventId:'${E("Demo.st.events.find(e=>e.slug==='neon-nights-live').id")}',ticketTypeId:'x',qty:1,seats:[]}],addons:[],donation:0,unlock:{}};})()`);
  W().location.hash='#/e/founders-summit'; await until(()=>W().document.querySelector('[data-action="qty"]'));
  click('[data-action="qty"][data-d="1"]'); click('[data-action="addToCart"]'); await sleep(80);
  ok(E("S.cart.items.every(i=>evById(i.eventId).box_office_id===S.events.find(e=>e.slug==='founders-summit').box_office_id)"),'cart holds one organizer at a time');
  const r=await E(`DB.placeOrder({buyer:{name:'Pat Buyer',email:'pat@example.com'},items:S.cart.items,addons:[],payment:'card',answers:Object.fromEntries(evById(S.cart.items[0].eventId).questions.filter(q=>q.scope!=='ticket').map(q=>[q.id,q.type==='terms'?true:'Acme'])),ticketAnswers:Object.fromEntries(evById(S.cart.items[0].eventId).questions.filter(q=>q.scope==='ticket').map(q=>[q.id,S.cart.items.flatMap(i=>Array(i.qty).fill(q.type==='select'?'None':'Pat Buyer'))])),card:{number:'4242424242424242',exp:'12/34',cvc:'123'}})`);
  const o=E(`Demo.st.orders.find(x=>x.id==='${r.id}')`);
  ok(o.box_office_id===harbor && o.data.platformFee>0 && o.data.tax>0,'order tagged to Harbor, Harbor tax applied, platform fee recorded: '+o.data.platformFee);

  // 2FA
  W().location.hash='#/admin/security'; await until(()=>has('Two-factor sign-in')); await sleep(60);
  await E('A.mfaStart()'); const sec=E('S.ui.sec.enr.secret'); await sleep(100);
  ok(!!W().document.querySelector('.mfa-qr canvas, .mfa-qr img'),'QR code for authenticator app shown');
  W().document.querySelector('#mfaCode').value=await E(`totp('${sec}')`); await E('A.mfaConfirm()'); await sleep(60);
  ok(E("!!Demo.st.mfa['moishsonn@gmail.com']"),'two-factor turned on');
  await as('moishsonn@gmail.com');
  ok(E('S.ui.login.mfa')&&!E('S.adm'),'sign-in now asks for authenticator code');
  E("S.ui.login.totp='000000'"); await E('A.loginMfa()'); ok(!E('S.adm')&&E('S.ui.login.err'),'wrong code rejected');
  E(`S.ui.login.totp=${JSON.stringify(await E(`totp('${sec}')`))}`); await E('A.loginMfa()'); await sleep(60);
  ok(E('S.adm&&S.adm.super'),'correct code signs in');
  const n=E("Demo.st.sessions.filter(s=>s.email==='moishsonn@gmail.com'&&!s.revoked).length");
  ok(n===1,'only the current session is active after sign-outs: '+n);

  // require 2FA for team
  await E(`(async()=>{S.ui.support='${harbor}'; await reloadAdmin('${harbor}'); await DB.saveBoxOffice({settings:{...S.adm.bo.settings,require2fa:true}});})()`);
  await as('director@harborarts.example'); ok(E('S.adm.needs2fa')&&E('S.adm.events.length')===0,'team-wide 2FA requirement withholds data until set up');

  // branding change shows on event page
  await as('owner@testhall.example');
  W().location.hash='#/admin/branding'; await until(()=>E('S.ui.brand'));
  E("S.ui.brand.branding.accent='#e4572e'; S.ui.brand.branding.font='Oswald'"); await E('A.saveBrand()'); await sleep(60);
  W().location.hash='#/b/'+nb.slug; await sleep(120);
  ok(W().document.documentElement.style.getPropertyValue('--accent')==='#e4572e','saved branding applied to public page');
  W().location.hash='#/admin/team/activity'; await sleep(80); ok(has('Changed box office'),'settings change in activity log');
  log('DONE');
}catch(e){log('ERROR '+e.message+'\n'+e.stack)}})();
</script></body></html>
