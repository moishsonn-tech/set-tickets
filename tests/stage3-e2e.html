(async()=>{try{

  await E('A.addToCart()'); await until(()=>W().location.hash.startsWith('#/cart'));
  E(`S.co.name='Standing Fan';S.co.email='floor@example.com';S.co.terms=true`); await E('A.placeOrder()'); E(`S.co.card={number:'4242424242424242',exp:'12/34',cvc:'123'}`); await E('A.payCard()'); await until(()=>W().document.querySelector('.e-ticket'));
  const gt=E(`S.order.tickets`); ok(gt.length===2 && gt.every(t=>t.area==='Standing floor' && t.row===''),'standing tickets carry their area, no row/seat');

  // ── venue library ──
  await as('moishsonn@gmail.com');
  ok(E('S.adm.bo.venues.length')===2,'two master venue charts seeded');
  W().location.hash='#/admin/venues'; await until(()=>W().document.querySelector('.ven-card')); ok(W().document.querySelectorAll('.ven-card .sm').length===2,'venue library page with chart previews');
  const v0=E('S.adm.bo.venues[0]');
  // attach to another event
  const j=ev('spring-jazz-brunch'); W().location.hash=`#/admin/event/${j.id}/seating`; await until(()=>E('S.draft&&S.draft.id')===j.id);
  await E(`A.loadVenue({dataset:{v:'${v0.id}'}})`); await sleep(30);
  ok(E('S.draft.seating.venueId')===v0.id && E('S.draft.ticketTypes.length')===j.ticketTypes.length+3 && Object.keys(E('S.draft.seating.index')).length===Object.keys(g.seating.index).length,'attach a venue chart: layout copied, price tiers added as ticket types');
  E('S.dirty=true'); await E('A.saveEvent()'); await sleep(60);
  // edit the master — events keep their own copy
  W().location.hash='#/admin/venues/'+v0.id; await until(()=>E('S.draft&&S.draft._venue')===v0.id);
  E("S.draft.seating.sections[0].name='Renamed in master'"); E('S.dirty=true'); await E('A.saveVenue()'); await sleep(40);
  ok(E(`Demo.st.boxOffices.find(b=>b.slug==='skyline-live').venues[0].chart.sections[0].name`)==='Renamed in master' && !ev('spring-jazz-brunch').seating.sections.some(s=>s.name==='Renamed in master') && !ev('winter-orchestra-gala').seating.sections.some(s=>s.name==='Renamed in master'),'editing a master chart never changes events that use it');
  // save an event's chart to the library
  W().location.hash=`#/admin/event/${c.id}/seating`; await until(()=>E('S.draft&&S.draft.id')===c.id);
  W().prompt=()=>'Club venue'; E("S.draft.seating.venueId=''"); await E('A.saveToVenue()');
  ok(E('S.adm.bo.venues.length')===3 && E('S.adm.bo.venues[2].name')==='Club venue' && E('S.adm.bo.venues[2].tiers.length')===3,'save an event\'s chart to the venue library');
  ok(E("Demo.st.audit.some(a=>a.kind==='venues.saved')"),'venue changes are in the activity log');
  log('DONE');
}catch(e){log('ERROR '+e.message+'\n'+e.stack)}})();
</script></body></html>
