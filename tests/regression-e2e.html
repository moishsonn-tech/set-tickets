<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="out">running</pre><iframe id="f" style="width:1300px;height:900px"></iframe><script>
const out=[], log=m=>{out.push(m);document.getElementById('out').textContent=out.join('\n')};
const f=document.getElementById('f'); const W=()=>f.contentWindow; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(fn,ms=5000)=>{const t=Date.now();while(Date.now()-t<ms){try{const v=fn();if(v)return v}catch(e){}await sleep(50)}throw new Error('timeout '+fn)};
const click=sel=>{const el=W().document.querySelector(sel); if(!el) throw new Error('no '+sel); el.click()};
const type=(sel,v)=>{const el=W().document.querySelector(sel); el.value=v; el.dispatchEvent(new Event('input',{bubbles:true}))};
const check=(sel)=>{const el=W().document.querySelector(sel); el.checked=true; el.dispatchEvent(new Event('input',{bubbles:true}))};
const ok=(c,m)=>log((c?'PASS ':'FAIL ')+m);
W && (async()=>{try{
  W().onerror=(e)=>log('PAGE ERROR '+e);
  f.src='/index.html#/'; await until(()=>W().eval('S') && !W().eval('S').loading); W().localStorage.clear(); W().sessionStorage.clear(); W().location.reload(); await sleep(300);
  await until(()=>W().eval('S') && !W().eval('S').loading && W().document.querySelector('.ev-card'));
  ok(W().document.querySelectorAll('.ev-card').length===5,'home lists 5 published events');
  // GA event: buy 2 GA + use discount
  W().location.hash='#/e/neon-nights-live'; await until(()=>W().document.querySelector('[data-action="qty"]'));
  const ga=W().eval('S').events.find(e=>e.slug==='neon-nights-live'); const gaTT=ga.ticketTypes[0].id;
  click(`[data-action="qty"][data-id="${gaTT}"][data-d="1"]`); click(`[data-action="qty"][data-id="${gaTT}"][data-d="1"]`);
  ok(W().eval('S').sel.qty[gaTT]===2,'qty stepper to 2');
  ok(!W().document.body.innerHTML.includes('VIP table'),'hidden ticket type not shown');
  type('[data-input="pw"]','VIPACCESS'); click('[data-action="unlock"]'); await until(()=>W().document.body.innerHTML.includes('VIP table'));
  ok(true,'access code unlocks hidden ticket');
  click('[data-action="addToCart"]'); await until(()=>W().location.hash.startsWith('#/cart')&&W().document.querySelector('[data-action="placeOrder"]'));
  type('[data-bind="co.code"]','WELCOME10'); click('[data-action="applyCode"]'); await until(()=>W().eval('S').co.disc);
  const q=W().cartQuote(); ok(q.subtotal===7000&&q.discount===1000,'discount applied: '+JSON.stringify({s:q.subtotal,d:q.discount,f:q.fee,t:q.total}));
  click('[data-action="placeOrder"]'); await sleep(100); ok(W().eval('S').co.err,'validation blocks empty form: '+W().eval('S').co.err);
  type('[data-bind="co.name"]','Test Buyer'); type('[data-bind="co.email"]','test@example.com'); check('[data-bind="co.terms"]');
  click('[data-action="placeOrder"]'); await until(()=>W().location.hash.startsWith('#/order/'),4000);
  await until(()=>W().document.querySelectorAll('.e-ticket').length);
  await sleep(300);
  ok(W().document.querySelectorAll('.e-ticket').length===2,'2 e-tickets rendered');
  ok(W().document.querySelectorAll('.qr canvas, .qr img').length>=2,'QR codes rendered');
  const ref=W().eval('S').order.order.ref; const code=W().eval('S').order.tickets[0].code;
  // seated event
  W().location.hash='#/e/winter-orchestra-gala'; await until(()=>W().document.querySelector('.st[data-action]'));
  for (let k=0;k<2;k++){ W().document.querySelectorAll('.st[data-action]:not(.mine)')[5].dispatchEvent(new MouseEvent('click',{bubbles:true})); await sleep(30); }
  ok(W().eval('S').sel.seats.length===2,'picked 2 seats on SVG map '+W().eval('S').sel.seats);
  const picked=[...W().eval('S').sel.seats];
  click('[data-action="addToCart"]'); await until(()=>W().document.querySelector('[data-action="placeOrder"]'));
  type('[data-bind="co.name"]','Seat Buyer'); type('[data-bind="co.email"]','seat@example.com'); check('[data-bind="co.terms"]');
  click('[data-action="placeOrder"]'); await until(()=>W().location.hash.startsWith('#/order/'),4000); await until(()=>W().eval('S').order?.tickets);
  ok(W().eval('S').order.tickets.map(t=>t.seat).sort().join()===picked.sort().join(),'seats assigned '+W().eval('S').order.tickets.map(t=>t.seat));
  // double-booking the same seat must fail
  let err=''; try{ await W().eval('DB').placeOrder({buyer:{name:'X',email:'x@x.com'},items:[{eventId:W().eval('S').order.order.event_ids[0],ticketTypeId:W().eval('S').order.tickets[0].ticket_type_id,qty:1,seats:[picked[0]]}],addons:[],payment:'card'});}catch(e){err=e.message}
  ok(/taken/.test(err),'double-book blocked: '+err);
  // a cheap ticket type cannot buy a premium seat
  const g=W().eval('Demo').st.events.find(e=>e.slug==='winter-orchestra-gala'); const prem=Object.keys(g.seating.index).find(id=>g.seating.index[id]===g.ticketTypes[0].id);
  err=''; try{ await W().eval('DB').placeOrder({buyer:{name:'X',email:'x@x.com'},items:[{eventId:g.id,ticketTypeId:g.ticketTypes[2].id,qty:1,seats:[prem]}],addons:[],payment:'card'});}catch(e){err=e.message}
  ok(/isn't a/.test(err),'seat-price mismatch rejected: '+err);
  // time slot event requires slot
  err=''; const k=W().eval('Demo').st.events.find(e=>e.slug==='city-food-festival'); try{ await W().eval('DB').placeOrder({buyer:{name:'X',email:'x@x.com'},items:[{eventId:k.id,ticketTypeId:k.ticketTypes[0].id,qty:1}],payment:'card'});}catch(e){err=e.message}
  ok(/time slot/.test(err),'slot required: '+err);
  // find tickets
  W().location.hash='#/tickets'; await until(()=>W().document.querySelector('[data-input="findRef"]'));
  type('[data-input="findRef"]',ref); type('[data-input="findEmail"]','test@example.com'); click('[data-action="findOrder"]'); await until(()=>W().location.hash.startsWith('#/order/'));
  ok(true,'find-my-tickets lookup works');
  // admin
  W().location.hash='#/admin'; await until(()=>W().document.querySelector('[data-input="loginEmail"]'));
  type('[data-input="loginEmail"]','moishsonn@gmail.com'); click('[data-action="login"]'); await until(()=>W().document.querySelector('.kpis'));
  ok(true,'admin dashboard loads');
  for (const p of ['events','orders','attendees','checkin','reports','marketing','team','settings']) { W().location.hash='#/admin/'+p; await sleep(150); ok(W().document.querySelector('.page-head'),'admin page '+p); }
  const ev=W().eval('S').adm.events[0];
  for (const t of ['details','tickets','schedule','seating','checkout','discounts','emails','share']) { W().location.hash=`#/admin/event/${ev.id}/${t}`; await sleep(150); ok(W().document.querySelector('.etabs'),'editor tab '+t); }
  // edit + save
  W().location.hash=`#/admin/event/${ga.id}/details`; await sleep(150);
  type('[data-bind="draft.name"]','Neon Nights Live!'); click('[data-action="saveEvent"]'); await sleep(200);
  ok(W().eval('S').events.find(e=>e.id===ga.id).name==='Neon Nights Live!','event save propagates to public');
  // seating designer: template, paint, save
  const fe=W().eval('S').adm.events.find(e=>e.slug==='comedy-night');
  W().location.hash=`#/admin/event/${fe.id}/seating`; await sleep(150);
  W().eval('S').draft.ticketTypes.push(W().eval('newTT')()); check('[data-bind="draft.seating.enabled"]'); await sleep(50);
  click('[data-action="smTemplate"][data-v="banquet"]'); await sleep(80);
  ok(W().eval('S').draft.seating.sections.length===12 && W().document.querySelectorAll('.sm-design .st').length===120,'banquet template: 12 tables, 120 seats');
  click('[data-action="smAdd"][data-v="rows"]'); await sleep(50);
  ok(W().document.querySelector('.sm-panel h3')&&W().eval('S').draft.seating.sections.length===13,'add section opens its panel');
  type('[data-bind="draft.seating.sections.12.rows"]','3'); await sleep(50);
  ok(W().document.querySelectorAll('.sm-design .st').length===150,'rows edit re-lays out (150 seats)');
  click('[data-action="smMode"][data-v="paint"]'); await sleep(30); W().eval('S').ui.smPaint=W().eval('S').draft.ticketTypes[1].id;
  const svg=W().document.querySelector('svg.sm-design'); const seat=svg.querySelector('[data-seat="T1-1"]');
  seat.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,clientX:1,clientY:1})); W().document.dispatchEvent(new PointerEvent('pointerup',{bubbles:true})); await sleep(50);
  ok(W().eval('S').draft.seating.prices['T1-1']===W().eval('S').draft.ticketTypes[1].id,'paint assigns seat price');
  click('[data-action="saveEvent"]'); await sleep(200);
  const saved=W().eval('S').adm.events.find(e=>e.id===fe.id); ok(Object.keys(saved.seating.index).length===150 && saved.seating.index['T1-1']===saved.ticketTypes[1].id,'save derives seat index ('+Object.keys(saved.seating.index||{}).length+')');
  // checkin
  let r=await W().eval('DB').checkin(code); ok(r.result==='ok','check-in ok'); r=await W().eval('DB').checkin(code); ok(r.result==='already','second scan flagged already');
  r=await W().eval('DB').checkin('NOPE123'); ok(r.result==='unknown','bad code rejected');
  // manual order + refund
  const before=W().eval('S').adm.orders.length; await W().eval('DB').placeOrder({buyer:{name:'Comp',email:'comp@x.com'},items:[{eventId:ga.id,ticketTypeId:gaTT,qty:2}],addons:[],payment:'manual'},true);
  await W().reloadAdmin(); ok(W().eval('S').adm.orders.length===before+1,'manual order created');
  const o=W().eval('S').adm.orders.find(x=>x.ref===ref); await W().eval('DB').setOrderStatus(o.id,'refunded'); r=await W().eval('DB').checkin(W().eval('Demo').st.tickets.find(t=>t.order_id===o.id).code); ok(r.result==='cancelled','refunded ticket rejected at door');
  // embed
  W().location.hash='#/embed/city-food-festival'; await sleep(200); ok(W().document.body.classList.contains('embed'),'embed mode');
  // ── scanner app ──
  ok(!/SING Entertainment'|Kumzitz|Chanukah|Jewish/.test(JSON.stringify(W().eval('Demo').st.events)),'no SING events in sample data');
  W().location.hash='#/scan'; await until(()=>W().document.querySelector('.sc-ev'));
  ok(W().document.querySelectorAll('.sc-ev').length>=2,'scanner lists events');
  const tonight=W().eval('S').adm.events.find(e=>e.slug==='neon-nights-live');
  W().document.querySelector(`[data-action="scPick"][data-id="${tonight.id}"]`).click(); await until(()=>W().document.querySelector('.sc-tabs'));
  const fresh=W().eval('S').adm.tickets.find(t=>t.event_id===tonight.id&&t.status==='valid'&&!t.checked_in_at);
  await W().eval('scanCheck')(fresh.code); ok(W().document.querySelector('.sc-result.ok'),'scanner: valid overlay');
  await W().eval('scanCheck')(fresh.code); ok(W().document.querySelector('.sc-result.warn')&&W().document.body.innerHTML.includes('First scanned'),'scanner: duplicate flagged');
  const other=W().eval('S').adm.tickets.find(t=>t.event_id!==tonight.id&&t.status==='valid'&&!t.checked_in_at);
  await W().eval('scanCheck')(other.code); ok(W().document.body.innerHTML.includes('Wrong event')&&!W().eval('S').adm.tickets.find(t=>t.id===other.id).checked_in_at,'scanner: wrong event rejected, not checked in');
  await W().eval('scanCheck')('ZZZZZZZZZZ'); ok(W().document.querySelector('.sc-result.bad'),'scanner: unknown code');
  click('[data-action="scDismiss"]'); W().document.querySelector('[data-action="scTab"][data-v="guests"]').click(); await sleep(50);
  ok(W().document.querySelectorAll('.sc-guest').length>5,'scanner: guest list');
  W().document.querySelector('[data-action="scTab"][data-v="stats"]').click(); await sleep(50); ok(W().document.querySelector('.sc-ring'),'scanner: stats');
  log('DONE');
}catch(e){log('ERROR '+e.message+'\n'+e.stack)}})();
</script></body></html>
