(async()=>{try{
  f.src='/index.html#/'; await until(()=>E('!S.loading')); W().localStorage.clear(); W().sessionStorage.clear(); W().location.reload(); await sleep(300);

  E('S.sc.last=null;render()');
  await E(`scanCheck('${bySeat('OL-A12').code}')`); ok([...W().document.querySelectorAll('.sc-seat div')].map(d=>d.textContent).join('|')==='Orchestra Left|Row A — Seat 12' && txt('.sc-res-type').includes('General'),'ORCHESTRA LEFT / ROW A — SEAT 12, with the ticket type');

  E(`(()=>{const e=Demo.st.events.find(x=>x.slug==='spring-jazz-brunch'); e.timeSlots=[{id:'js1',start:new Date(Date.now()+3600e3).toISOString(),capacity:50},{id:'js2',start:new Date(Date.now()+5*3600e3).toISOString(),capacity:50}]; e.salesStart=null; Demo.save();})()`);
  const jz=ev('spring-jazz-brunch'), rj=await buy({items:[{eventId:jz.id,ticketTypeId:jz.ticketTypes[0].id,qty:1,slotId:'js2'}]}), jt=live(rj.id)[0];

  ok((await scan(jt.code,jz.id,{slot:''})).result==='ok','“All showtimes” accepts it');

  ok((await scan(jt.code,jz.id)).result==='inactive','a ticket for an archived event → TICKET NOT ACTIVE');

  const devs=await E('DB.devices()'); ok(['dev_t1','dev_t2','dev_door1'].every(id=>devs.some(d=>d.id===id)) && devs.find(d=>d.id==='dev_t2').name==='Test phone 2','every scanning device is listed');

  await E(`DB.deviceAction('dev_t2','enable')`); await E(`DB.deviceAction('dev_t2','rename','Lobby tablet')`);

  await view('#/admin/checkin'); await until(()=>has('Scanner devices') && has('Lobby tablet'));
  ok(has('Switch off') && has('Door phone 1') && has('VIP tablet'),'Scanner app page lists the devices with switch-off');

  // ── §13 real-time sync: back-office changes reach the door at once ──
  const stalls=gala.ticketTypes.find(t=>t.name==='Stalls'), isStalls=`id=>Demo.st.events.find(e=>e.slug==='winter-orchestra-gala').seating.index[id]==='${stalls.id}'`;

  const ru=await buy({items:[{eventId:gala.id,ticketTypeId:stalls.id,qty:1,seats:freeSeats('winter-orchestra-gala',isStalls,1)}]}), u1=live(ru.id)[0];
  const upg=await act(ru.id,'change',{changes:[{ticket:u1.id,seat:up}],settle:'waive',downgrade:'none'});
  const rup=await E2(`DB.checkin('${upg.tickets[0].to.ticket}',false,'${gala.id}',scanOpts())`);
  ok(rup.result==='ok' && rup.ticket.type==='Premium','upgrade → the scanner shows the new ticket type');
  await E2('doorTick()'); await sleep(50); E2(`S.sc.last=${JSON.stringify(rup)};render()`); await sleep(40);
  ok(W2().document.querySelector('.sc-res-type').textContent.includes('Premium') && W2().document.querySelector('.sc-seat').textContent.includes('Premium centre'),'scanner screen: Premium, Premium centre');
  E2('S.sc.last=null;render()');

  // ── §12 reissue / resend from the order page ──
  await E('reloadAdmin()'); await view(`#/admin/orders/${rn.id}`); await until(()=>has('Reissue tickets'));

  ok(has('The old codes stop working at the door immediately'),'reissue panel explains the old code dies at once');
  W().document.querySelector('[data-action="opGo"][data-v="reissue"]').click(); await until(()=>E(`Demo.st.orderLog.some(x=>x.order_id==='${rn.id}'&&x.kind==='reissue')`));
  const newest=live(rn.id)[0];
  ok(newest.code!==nn && newest.seat===to && (await scan(nn,gala.id)).result==='replaced','reissue from the order page: new QR, same seat, old QR rejected');
  ok(E(`Demo.st.outbox.filter(m=>m.order_id==='${rn.id}'&&m.kind==='tickets').length`)>=1 && has('Resend tickets'),'reissued tickets are queued to the customer; resend is there too');

  // ── §7 manual search (door staff) ──
  await as('door@example.com');
  const dn=E(`Demo.st.tickets.find(t=>t.event_id==='${neon.id}'&&t.status==='valid'&&!t.checked_in_at)`), dno=E(`Demo.st.orders.find(o=>o.id==='${dn.order_id}')`);
  const by=async q=>(await E(`DB.doorSearch('${neon.id}',${JSON.stringify(q)})`)).map(x=>x.id);
  ok((await by(dno.data.buyer.name)).includes(dn.id) && (await by(dno.buyer_email)).includes(dn.id) && (await by(dno.ref)).includes(dn.id) && (await by(dn.code)).includes(dn.id),'door staff find a guest by name, email, order number or ticket number');
  E(`Demo.st.orders.find(o=>o.id==='${dn.order_id}').data.buyer.phone='(718) 555-0123';Demo.save()`);
  ok((await by('7185550123')).includes(dn.id) && (await by('555-0123')).includes(dn.id),'… or by phone');
  const one=(await E(`DB.doorSearch('${neon.id}',${JSON.stringify(dno.buyer_email)})`))[0];
  ok(!('buyer_email' in one) && !JSON.stringify(one).includes(dno.buyer_email) && !JSON.stringify(one).includes('555-0123') && !('paid' in one),'search results never carry the email, phone or money');
  W().location.hash='#/scan'; await until(()=>W().document.querySelector('.sc-ev,.sc-tabs,[data-action="scSetupDone"]'));
  E(`S.sc.evId='${neon.id}';S.sc.entrance='en_main';S.sc.slot='';S.sc.tab='guests';S.sc.q=${JSON.stringify(dno.buyer_email)};render()`);
  await until(()=>W().document.querySelector(`[data-action="scToggle"][data-v="${dn.code}"]`));
  W().document.querySelector(`[data-action="scToggle"][data-v="${dn.code}"]`).click(); await until(()=>tk(dn.code).checked_in_at);
  ok(tk(dn.code).checkin.manual===true && E(`Demo.st.scanLog[0].manual`)===true,'manual check-in from the search, marked manual in the log');

  // ── §11 scanner permissions ──
  await as('scanner@example.com');
  ok(JSON.stringify(E('S.adm.me.perms').slice().sort())==='["door.checkin","door.scan"]','Scanner staff template: scan + check in only');
  await view('#/admin'); ok(has('Your access is the scanner') && !W().document.querySelector('.side a[href="#/admin/orders"]') && !W().document.querySelector('.side a[href="#/admin/reports"]'),'scanner staff: no dashboard, orders or reports — just a way into the scanner');
  ok(E('S.adm.orders.length')===0 && E(`S.adm.tickets.every(t=>t.paid==null&&t.face==null&&t.refunded==null&&!Object.keys(t.answers||{}).length&&!t.promo&&t.holder==='Guest')`),'scanner staff get no orders, money, answers, codes or names');
  const sx=E(`Demo.st.tickets.find(t=>t.event_id==='${neon.id}'&&t.status==='valid'&&!t.checked_in_at)`);
  const rs=await scan(sx.code,neon.id,{entrance:'en_main'}); ok(rs.result==='ok' && rs.ticket.holder==='Guest' && !('paid' in rs.ticket) && rs.ticket.type,'scanner staff: scan, valid, basic seating / type info');
  ok(/permission/.test(String(await throwsP(`DB.checkin('${sx.code}',true,'${neon.id}')`))),'… cannot undo a check-in');
  ok(/permission/.test(String(await throwsP(`DB.doorSearch('${neon.id}','smith')`))) && /permission/.test(String(await throwsP(`DB.doorLog('${neon.id}')`))) && /permission/.test(String(await throwsP(`DB.devices()`))),'… cannot search guests, read the scan history or manage devices');
  const vip=E(`Demo.st.tickets.find(t=>t.event_id==='${neon.id}'&&t.status==='valid'&&!t.checked_in_at&&t.ticket_type_id==='${neon.ticketTypes[0].id}')`);
  ok(/permission/.test(String(await throwsP(`DB.checkin('${vip.code}',false,'${neon.id}',{entrance:'en_vip',override:true})`))),'… cannot override the entrance warning');
  ok(/permission/.test(String(await throwsP(`DB.orderAction('${rn.id}','reissue',{})`))),'… cannot reissue tickets');

  // ── §14 scan history ──
  await as('moishsonn@gmail.com');
  const lg=await E(`DB.doorLog('${neon.id}')`);
  ok(['ok','already','unknown','wrong_entrance'].every(r=>lg.some(x=>x.result===r)) && lg.every(x=>x.at && 'device_name' in x && 'entrance' in x && x.by),'scan history: check-ins, duplicates and invalid attempts with time, device, entrance and employee');
  await view(`#/admin/event/${neon.id}/door`); await until(()=>has('Scan history') && W().document.querySelector('[data-action="dlogF"]') && !has('Loading…'));
  ok(has('Duplicates') && has('Invalid') && has('VIP tablet') && has('By entrance') && has('Entrances'),'Door & check-in tab: totals, by entrance, entrances, scan history');
  W().document.querySelector('[data-action="dlogF"][data-v="bad"]').click(); await sleep(60);
  ok([...W().document.querySelectorAll('.tbl .chip.mini.bad,.tbl .chip.mini.warn')].length>0 && ![...W().document.querySelectorAll('.tbl tbody tr')].some(r=>r.textContent.includes('Valid')),'filter: invalid attempts only');
  // entrances are edited on the event (Save changes) and kept in its history
  W().document.querySelector('[data-action="enAdd"]').click(); await sleep(40);
  ok(E('S.draft.entrances.length')===3 && E('S.dirty'),'add an entrance');
  E(`S.draft.entrances[2].name='Balcony entrance'`); await E('A.saveEvent()'); await sleep(80);
  ok(E(`Demo.st.events.find(e=>e.id==='${neon.id}').entrances.length`)===3 && E(`Demo.st.audit.some(a=>a.target==='${neon.id}'&&/Entrances/.test(a.summary))`),'saved entrances are in the event history');

  // ── offline: validate locally, queue, sync when back ──
  W().location.hash='#/scan'; await sleep(80); E(`S.sc.evId='${neon.id}';S.sc.entrance='en_main';S.sc.slot='';render()`);
  const off=E(`S.adm.tickets.find(t=>t.event_id==='${neon.id}'&&t.status==='valid'&&!t.checked_in_at)`);
  const lr=E(`localCheckin('${off.code}',false,scanOpts())`); ok(lr.result==='ok' && lr.offline && E('S.sc.queue.length')===1,'offline: validated on the phone and queued');
  await E('flushQueue()'); ok(E('S.sc.queue.length')===0 && !!tk(off.code).checked_in_at,'back online: the queued check-in reaches the server');
  ok(E(`Demo.st.orders.filter(o=>o.status==='paid').every(o=>Demo.st.outbox.filter(m=>m.order_id===o.id&&m.kind==='confirmation').length<=1)`),'still exactly one order confirmation per order');
  log('DONE');
}catch(e){log('ERROR '+e.message+'\n'+e.stack)}})();
</script></body></html>
