<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="out">running</pre><iframe id="f" style="width:1300px;height:900px"></iframe><script>
// Stage 10: a checkout now records which policy versions the buyer accepted. The UI sends them itself; direct DB.placeOrder calls in
// this older suite accept the current ones (acceptAll), so these checks keep testing what they were written for. Its many orders from one
// browser stand for many different buyers, so the demo's per-browser checkout rate limit is reset for them.
function acceptAll(w){try{if(w&&w.eval&&w.eval('typeof DB==="object"&&!DB._acc'))w.eval(`(()=>{const po=DB.placeOrder;DB.placeOrder=function(p,t){for(const k in RL)delete RL[k];if(p&&p.accepted===undefined&&!t){const st=Demo.st,ids=[...new Set([...(p.items||[]),...(p.addons||[])].map(i=>i.eventId))],evs=ids.map(id=>st.events.find(e=>e.id===id)).filter(Boolean),bo=st.boxOffices.find(b=>b.id===(evs[0]&&evs[0].box_office_id));p={...p,accepted:policiesFor(bo,evs).map(({kind,eventId,version})=>({kind,eventId,version}))}}return po.call(this,p,t)};DB._acc=1})()`)}catch(e){}return w}
// Stage 4 — ticket types, pricing rules, promo codes, products, bundles, upsells, tracking codes (Eli's Step 4). Run from the local server: /stage4-e2e.html
const out=[], log=m=>{out.push(m);document.getElementById('out').textContent=out.join('\n')};
const f=document.getElementById('f'); const W=()=>acceptAll(f.contentWindow); const sleep=ms=>new Promise(r=>setTimeout(r,ms)); const E=x=>W().eval(x);
const until=async(fn,ms=6000)=>{const t=Date.now();while(Date.now()-t<ms){try{const v=fn();if(v)return v}catch(e){}await sleep(40)}throw new Error('timeout '+fn)};
const has=t=>W().document.body.textContent.includes(t);
const ok=(c,m)=>log((c?'PASS ':'FAIL ')+m+(c?'':'  [hash '+W().location.hash+'] last error: '+lastErr));
async function as(email){ await E('A.signOut()'); await sleep(80); W().location.hash='#/admin'; await until(()=>W().document.querySelector('[data-action="demoAs"]'));
  E(`S.ui.login.email=${JSON.stringify(email)}`); await E('A.login()'); await until(()=>E('S.adm')); await sleep(60); }
let lastErr=''; async function throwsP(code){ try{ await E(code); lastErr='(no error)'; return false }catch(e){ lastErr=e.message; return e.message||true } }
const ev=slug=>E(`Demo.st.events.find(e=>e.slug==='${slug}')`);
const tt=(slug,name)=>ev(slug).ticketTypes.find(t=>t.name===name);
const promo=code=>E(`Demo.st.promos.find(p=>p.code==='${code}')`);
const setPromo=(code,patch)=>E(`Object.assign(Demo.st.promos.find(p=>p.code==='${code}'),${JSON.stringify(patch)});Demo.save()`);
const free=(slug,ttName,n)=>E(`(()=>{const e=Demo.st.events.find(e=>e.slug==='${slug}'),t=e.ticketTypes.find(t=>t.name==='${ttName}');return [...seatStates(e,{tickets:Demo.st.tickets,statuses:Demo.st.seatStatus,orders:Demo.st.orders}).values()].filter(x=>x.state==='available'&&x.p.tt===t.id).map(x=>x.p.id).slice(0,${n})})()`);
const buyer=(n='Test Buyer',e='buyer4@test.co')=>({name:n,email:e});
const place=(p,team)=>`DB.placeOrder(${JSON.stringify({buyer:buyer(),addons:[],payment:'card',card:{number:'4242424242424242',exp:'12/34',cvc:'123'},...p})}${team?',true':''})`;
const order=id=>E(`Demo.st.orders.find(o=>o.id==='${id}')`), tickets=id=>E(`Demo.st.tickets.filter(t=>t.order_id==='${id}')`);
const Q=(cart,code)=>E(`quote(${JSON.stringify(cart)},Demo.st.events,{...DEFAULT_SETTINGS,...Demo.st.boxOffices.find(b=>b.id===Demo.st.events.find(e=>e.id==='${cart.items[0]?.eventId||cart.addons[0].eventId}').box_office_id).settings},${code?`publicPromo(Demo.st.promos.find(p=>p.code==='${code}'),'${code}')`:'null'},{avail:Object.fromEntries(Demo.st.events.map(e=>[e.id,availabilityFrom(Demo.st.tickets,e.id,[],'',Demo.st.orders)]))})`);
(async()=>{try{
  f.src='/index.html#/'; await until(()=>E('!S.loading')); W().localStorage.clear(); W().sessionStorage.clear(); W().location.reload(); await sleep(300);
  await until(()=>E('!S.loading') && W().document.querySelector('.ev-card'));
  W().onerror=(e)=>log('PAGE ERROR '+e); W().onunhandledrejection=(e)=>log('PAGE REJECTION '+(e.reason&&e.reason.stack||e.reason)); W().confirm=()=>true;
  E(`Demo.st.events.find(e=>e.slug==='winter-orchestra-gala').seating.noSingles=false;Demo.save()`);  // the gap rule is Stage 3's; keep seat picks simple here

  ok(order(rU.id).data.subtotal===9500 && tickets(rU.id).map(t=>t.face).sort().join()==='2500,3500,3500','the order and its tickets keep each phase price');
  ok(Q({items:[{eventId:neon.id,ticketTypeId:ga.id,qty:1}],addons:[]}).lines[0].unit===3500,'next buyer pays the new price');
  q=Q({items:[{eventId:g.id,ticketTypeId:stalls.id,qty:6,seats:free('winter-orchestra-gala','Stalls',6)}],addons:[]});

  const pass=tt('city-food-festival','Tasting pass');
  ok(Q({items:[{eventId:food.id,ticketTypeId:pass.id,qty:1,slotId:food.timeSlots[1].id}],addons:[]}).lines[0].unit===5900 && Q({items:[{eventId:food.id,ticketTypeId:pass.id,qty:1,slotId:food.timeSlots[0].id}],addons:[]}).lines[0].unit===4900,'different price per showtime ($59 evening, $49 midday)');
  ok(E(`seatInfo(Demo.st.events.find(e=>e.slug==='winter-orchestra-gala'),'CEN-B5').area`)==='Premium centre' && prem.price===10000 && stalls.price===6500,'different prices by seating area (Premium centre $100 vs Stalls $65)');

  // admin manual price override
  await as('moishsonn@gmail.com');
  const ov=await E(place({items:[{eventId:neon.id,ticketTypeId:ga.id,qty:2,price:1234}],payment:'manual'},true));
  const ovt=tickets(ov.id); ok(ovt.length===2 && ovt.every(t=>t.paid===1234 && t.face===3500 && t.price_override && t.ticket_type_id===ga.id) && order(ov.id).data.subtotal===2468,'manual price override: charged $12.34, face value + real type kept');
  await as('support@skyline.example');
  ok(/permission to change ticket prices/.test(String(await throwsP(place({items:[{eventId:neon.id,ticketTypeId:ga.id,qty:1,price:100}],payment:'manual'},true)))),'override needs the “Change pricing” permission');
  ok(/not allowed/.test(String(await throwsP(place({items:[{eventId:neon.id,ticketTypeId:ga.id,qty:1,price:100}]})))),'buyers can never send a price');

  // ── §3 promo codes: Eli's BINAH15 example ──
  const b=JSON.parse(JSON.stringify(promo('BINAH15'))); ok(b.amount===15 && b.prices.join()==='10000' && b.maxTickets===4 && b.maxUses===100 && new Date(b.expires).getDay()===0 && new Date(b.expires).getHours()===10,'BINAH15 seeded: 15%, $100 seats only, max 4 per order, 100 uses, expires Sunday 10:00 AM');

  ok(/doesn't apply/.test(Q({items:[{eventId:g.id,ticketTypeId:stalls.id,qty:2,seats:s2}],addons:[]},'BINAH15').promoErr),'BINAH15 on Stalls only: “doesn\'t apply”');

  setPromo('BINAH15',{expires:new Date(Date.now()-6e4).toISOString()});

  setPromo('BINAH15',{expires:b.expires,maxUses:E(`Demo.st.orders.filter(o=>o.data.promo?.id==='${b.id}'&&['paid','pending'].includes(o.status)).length`)});
  ok(/fully used/.test(String(await throwsP(place({items:[{eventId:g.id,ticketTypeId:prem.id,qty:1,seats:p5.slice(2,3)}],code:'BINAH15'})))),'max total uses enforced');
  setPromo('BINAH15',{maxUses:100,startsAt:new Date(Date.now()+864e5).toISOString()});
  ok(/isn't active yet/.test(String(await throwsP(place({items:[{eventId:g.id,ticketTypeId:prem.id,qty:1,seats:p5.slice(2,3)}],code:'BINAH15'})))),'start date enforced');
  setPromo('BINAH15',{startsAt:''});
  // per customer / fixed off order / event targeting
  const w1=await E(`DB.placeOrder({buyer:{name:'W',email:'welcome@test.co'},items:[{eventId:'${neon.id}',ticketTypeId:'${ga.id}',qty:2}],addons:[],payment:'card',card:{number:'4242424242424242',exp:'12/34',cvc:'123'},code:'WELCOME10'})`);
  ok(order(w1.id).data.discount===1000 && tickets(w1.id).reduce((t,x)=>t+x.discount,0)===1000,'fixed $10 off the order, shared across the tickets');
  ok(/already used/.test(String(await throwsP(`DB.placeOrder({buyer:{name:'W',email:'WELCOME@test.co'},items:[{eventId:'${neon.id}',ticketTypeId:'${ga.id}',qty:1}],addons:[],payment:'card',card:{number:'4242424242424242',exp:'12/34',cvc:'123'},code:'WELCOME10'})`))),'max uses per customer enforced (same email)');
  ok(/doesn't apply/.test(String(await throwsP(place({items:[{eventId:g.id,ticketTypeId:stalls.id,qty:1,seats:s2.slice(0,1)}],code:'WELCOME10'})))),'event-specific code refused on another event');
  ok(/not valid/.test(String(await throwsP(place({items:[{eventId:g.id,ticketTypeId:stalls.id,qty:1,seats:s2.slice(0,1)}],code:'FAMILY5'})))),'another box office\'s code is not valid here');
  // booking-fee discount + minimum quantity
  ok(/at least 4 tickets/.test(Q({items:[{eventId:neon.id,ticketTypeId:ga.id,qty:2}],addons:[]},'NOFEES').promoErr),'minimum ticket quantity enforced');
  q=Q({items:[{eventId:neon.id,ticketTypeId:ga.id,qty:4}],addons:[]},'NOFEES');
  ok(q.discount===0 && q.feeDiscount>0 && q.fee===0 && q.total===q.subtotal+q.tax,'NOFEES: discounts the booking fee only (fee → $0, ticket price untouched)');
  setPromo('NOFEES',{maxQty:3}); ok(/up to 3 tickets/.test(Q({items:[{eventId:neon.id,ticketTypeId:ga.id,qty:4}],addons:[]},'NOFEES').promoErr),'maximum ticket quantity enforced'); setPromo('NOFEES',{maxQty:0});
  setPromo('NOFEES',{on:'both',type:'pct',amount:50}); q=Q({items:[{eventId:neon.id,ticketTypeId:ga.id,qty:4}],addons:[]},'NOFEES');
  ok(q.discount===7000 && q.feeDiscount>0,'“both”: 50% off ticket price and booking fee'); setPromo('NOFEES',{on:'fee',amount:100});
  // bulk unique single-use codes, 100% off, max 2 tickets
  const press=promo('PRESS').codes[0], s4=free('winter-orchestra-gala','Stalls',5);
  const rp=await E(place({items:[{eventId:g.id,ticketTypeId:stalls.id,qty:3,seats:s4.slice(0,3)}],code:press.toLowerCase()}));
  ok(order(rp.id).data.code===press && order(rp.id).data.discount===2*6500 && tickets(rp.id).filter(t=>t.paid===0).length===2,'bulk unique code: 100% off, max 2 discounted tickets per order');
  ok(/already been used/.test(String(await throwsP(place({items:[{eventId:g.id,ticketTypeId:stalls.id,qty:1,seats:s4.slice(3,4)}],code:press})))),'a unique code works once');
  ok(!!(await E(place({items:[{eventId:g.id,ticketTypeId:stalls.id,qty:1,seats:s4.slice(3,4)}],code:promo('PRESS').codes[1]}))),'the next unique code still works');
  // product-only promo with minimum purchase
  const park=g.addons.find(a=>a.name==='Parking pass');
  ok(/minimum purchase/.test(Q({items:[{eventId:g.id,ticketTypeId:stalls.id,qty:1,seats:s4.slice(4,5)}],addons:[{eventId:g.id,addonId:park.id,qty:1}]},'PARKFREE').promoErr),'minimum purchase amount enforced');
  q=Q({items:[{eventId:g.id,ticketTypeId:prem.id,qty:2,seats:p5.slice(2,4)}],addons:[{eventId:g.id,addonId:park.id,qty:2}]},'PARKFREE');
  ok(q.discount===2500 && q.lines.find(l=>l.kind==='addon').disc===2500,'product-specific code: one free parking pass (max 1 discounted item)');
  // fixed off each, ticket-type specific (Harbor's kids show)
  const adult=tt('kids-science-show','Adult'), child=tt('kids-science-show','Child (2–12)');
  q=Q({items:[{eventId:kids.id,ticketTypeId:adult.id,qty:2,slotId:kids.timeSlots[2].id},{eventId:kids.id,ticketTypeId:child.id,qty:3,slotId:kids.timeSlots[2].id}],addons:[]},'FAMILY5');
  ok(q.discount===1500,'ticket-type code: $5 off each child ticket only');
  // showtime / bundle targeting via the admin API
  await as('moishsonn@gmail.com');

  q=Q({items:[{eventId:neon.id,bundleId:neon.bundles[0].id,qty:1},{eventId:neon.id,ticketTypeId:ga.id,qty:1}],addons:[]},'LATESHOW');
  ok(q.discount===900 && q.lines.find(l=>l.kind==='bundle').disc===900,'bundle-specific code: 20% off the package only');
  ok(/already in use/.test(String(await throwsP(`DB.savePromo({...newPromo(),code:'ALEX'})`))),'codes are unique across promo and tracking codes');

  ok(has('BINAH15') && has('Discounted') && has('Revenue with codes'),'Promotions page lists every code with its numbers');
  W().location.hash='#/admin/promos/code/'+b.id; await until(()=>W().document.querySelector('.kv-grid'));
  ok(has('Where it was used') && has('Customers') && has('Original value') && W().document.querySelectorAll('.targets').length>=5,'code editor: targeting + report side by side');

  // ── §5 products ──
  const tee=neon.addons.find(a=>a.name==='Tour T-shirt'), npark=neon.addons.find(a=>a.name==='Parking');
  const rt=await E(place({items:[],addons:[{eventId:neon.id,addonId:tee.id,qty:2}]}));
  ok(order(rt.id).data.total>0 && !tickets(rt.id).length && order(rt.id).event_ids[0]===neon.id,'standalone product order (no ticket)');
  ok(/only be bought with a ticket/.test(String(await throwsP(place({items:[],addons:[{eventId:neon.id,addonId:npark.id,qty:1}]})))),'non-standalone product needs a ticket');
  const meet=g.addons.find(a=>a.name==='Meet the soloists');
  ok(/only available with/.test(String(await throwsP(place({items:[{eventId:g.id,ticketTypeId:stalls.id,qty:1,seats:free('winter-orchestra-gala','Stalls',1)}],addons:[{eventId:g.id,addonId:meet.id,qty:1}]})))),'section-specific product refused with a Stalls seat');
  const rm=await E(place({items:[{eventId:g.id,ticketTypeId:prem.id,qty:1,seats:free('winter-orchestra-gala','Premium',1)}],addons:[{eventId:g.id,addonId:meet.id,qty:1}]}));
  ok(!!rm.id && tickets(rm.id)[0].extras.some(x=>x.includes('Meet the soloists')),'…allowed with a Premium centre seat; the ticket records its add-on');
  ok(/Maximum 2/.test(String(await throwsP(place({items:[{eventId:g.id,ticketTypeId:prem.id,qty:1,seats:free('winter-orchestra-gala','Premium',1)}],addons:[{eventId:g.id,addonId:meet.id,qty:3}]})))),'per-order product limit');
  E(`(()=>{const e=Demo.st.events.find(e=>e.slug==='neon-nights-live'),a=e.addons.find(a=>a.name==='Parking');a.qty=availabilityFrom(Demo.st.tickets,e.id,[],'',Demo.st.orders).ad[a.id]||0;Demo.save()})()`);
  ok(/0 Parking left/.test(String(await throwsP(place({items:[{eventId:neon.id,ticketTypeId:ga.id,qty:1}],addons:[{eventId:neon.id,addonId:npark.id,qty:1}]})))),'product inventory enforced');
  ok(/0 Parking left/.test(String(await throwsP(place({items:[{eventId:neon.id,bundleId:neon.bundles[0].id,qty:1}]})))),'…including parking inside a package');
  E(`(()=>{const e=Demo.st.events.find(e=>e.slug==='neon-nights-live');e.addons.find(a=>a.name==='Parking').qty=0;e.addons.find(a=>a.name==='Tour T-shirt').salesEnd=new Date(Date.now()-1000).toISOString();Demo.save()})()`);
  ok(/not on sale/.test(String(await throwsP(place({items:[],addons:[{eventId:neon.id,addonId:tee.id,qty:1}]})))),'product off-sale date');
